  - name: SG 新加坡
    icon: https://raw.githubusercontent.com/arthur97172/Rule_script/main/Iconset/SG.png
    type: url-test
    include-all: true
    interval: 120
    tolerance: 50
    lazy: true
    filter: "(?i)(新加坡|坡|狮城|🇸🇬|sg|singapore)"
  - filter: (?i)(india|in\b|ind\b|印度)
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/India.png
    include-all: true
    lazy: true
    name: IN 印度
    tolerance: 50
    type: url-test
  - name: 其它地区
    icon: https://raw.githubusercontent.com/arthur97172/Rule_script/main/Iconset/World_Map.png
    type: url-test
    include-all: true
    interval: 120
    tolerance: 50
    lazy: true
    filter: "(?i)^(?!.*(?:🇭🇰|🇹🇼|🇯🇵|🇰🇷|🇺🇸|🇸🇬|🇨🇳|港|hk|hong|台|tw|taiwan|日本|jp|japan|韩|kr|korea|美|us|states|新加坡|sg|singapore|防失联|入门无)).*"
